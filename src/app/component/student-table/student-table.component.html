<div *ngIf="students.length > 0; else noStudents">
    <mat-toolbar color="primary">
      <span>Student List</span>
    </mat-toolbar>
  
    <table mat-table [dataSource]="students" class="mat-elevation-z8">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let student">{{ student.name }}</td>
      </ng-container>
  
      <!-- DOB Column -->
      <ng-container matColumnDef="dob">
        <th mat-header-cell *matHeaderCellDef>DOB</th>
        <td mat-cell *matCellDef="let student">{{ student.dob | date }}</td>
      </ng-container>
  
      <!-- Gender Column -->
      <ng-container matColumnDef="gender">
        <th mat-header-cell *matHeaderCellDef>Gender</th>
        <td mat-cell *matCellDef="let student">{{ student.gender }}</td>
      </ng-container>
  
      <!-- Address Column -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Address</th>
        <td mat-cell *matCellDef="let student">{{ student.address }}</td>
      </ng-container>
  
      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let student">{{ student.email }}</td>
      </ng-container>
  
      <!-- Mobile Column -->
      <ng-container matColumnDef="mobile">
        <th mat-header-cell *matHeaderCellDef>Mobile</th>
        <td mat-cell *matCellDef="let student">{{ student.mobile }}</td>
      </ng-container>
  
      <!-- Action Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let student; let i = index">
          <div style="display: flex; justify-content: center; align-items: center; gap: 10px; cursor: pointer;">
            <button mat-button color="warn" (click)="deleteStudent(i)">
              <mat-icon>delete</mat-icon> Delete
            </button>
            <button mat-button color="primary" (click)="openEditDialog(student, i)">
              <mat-icon>edit</mat-icon> Edit
            </button>
          </div>
        </td>
      </ng-container>
      
  
      <!-- Header and Row Definition -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  
  <ng-template #noStudents>
    <mat-card>
      <mat-card-content>
        <p>No students found.</p>
      </mat-card-content>
    </mat-card>
  </ng-template>
